<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расписание</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">
    <h1>Расписание занятий</h1>
    
    <!-- Индикатор текущей недели -->
    <div class="week-indicator">
        <div class="week-toggle">
            <button id="toggleWeek" class="week-btn">Переключить неделю</button>
            <div id="currentWeek" class="current-week">Верхняя неделя</div>
        </div>
        <div class="subgroup-info">
            <span class="subgroup-label">Ваша подгруппа:</span>
            <select id="subgroupSelect">
                <option value="all">Все подгруппы</option>
                <option value="1">Подгруппа 1</option>
                <option value="2">Подгруппа 2</option>
            </select>
        </div>
    </div>

    <nav class="day-nav">
        <button data-day="pn">Пн</button>
        <button data-day="vt">Вт</button>
        <button data-day="sr">Ср</button>
        <button data-day="cht">Чт</button>
        <button data-day="pt">Пт</button>
        <button data-day="sb">Сб</button>
    </nav>

    <div id="schedule"></div>
</div>

</body>
</html>
